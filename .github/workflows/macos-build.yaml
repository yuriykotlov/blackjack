name: macOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON

      - name: Build main executable and tests
        run: cmake --build build --config Debug

      - name: Create test-results directory
        run: mkdir -p test-results

      - name: Run tests
        run: ctest --test-dir build -C Debug --output-on-failure --output-junit "${{ matrix.os }}.xml"

      - name: Test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test report (macOS)
          path: build/*.xml
          reporter: java-junit